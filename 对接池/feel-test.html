<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KD 原样 vs 补好之后 — 手感对照</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --txt:#e6edf3; --dim:#8b949e;
    --kd:#e30022; --fixed:#4fd658; --warnA:#e30022; --warnB:#ff8a3d;
    --cell:56px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; min-height:100%;
  }
  header{
    padding:14px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:18px; flex-wrap:wrap;
  }
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
  header .q{color:var(--dim);font-size:13px}
  header .q b{color:#ffd66b;font-weight:600}
  .hint{margin-left:auto;color:var(--dim);font-size:12.5px}
  kbd{
    background:#21262d;border:1px solid var(--line);border-bottom-width:2px;
    border-radius:4px;padding:1px 6px;font:12px/1.4 ui-monospace,Consolas,monospace;color:#c9d1d9;
  }
  main{display:grid;grid-template-columns:1fr 1fr;gap:0;flex:1}
  main > section{padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
  main > section + section{border-left:1px solid var(--line)}
  .pane-head{display:flex;align-items:center;gap:10px}
  .pane-head h2{font-size:14px;margin:0;font-weight:600}
  .tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
  .tag.kd{color:#ff7b8a;border-color:#5e2530;background:#2a1116}
  .tag.fx{color:#7ee787;border-color:#24502f;background:#0f2417}

  .verdict{
    font-size:13.5px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);
    background:#0b0f14;min-height:38px;display:flex;align-items:center;gap:8px;
  }
  .verdict .lbl{color:var(--dim);font-size:12px;flex:0 0 auto}
  .verdict.unknown{color:var(--dim);font-style:italic}
  .verdict.safe{color:#7ee787;border-color:#24502f;background:#0f2417}
  .verdict.soon{color:#ffd66b;border-color:#5a4a1f;background:#241f10}
  .verdict.now{color:#ff9d9d;border-color:#63262b;background:#2a1116}

  .board{
    display:grid;grid-template-columns:repeat(8,var(--cell));grid-template-rows:repeat(8,var(--cell));
    gap:2px;background:#05070a;padding:6px;border:1px solid var(--line);border-radius:10px;
    width:max-content;position:relative;user-select:none;
  }
  .cell{position:relative;background:#11161d;border-radius:3px;overflow:hidden}
  .cell.dark{background:#0f141a}
  .cell .tagtxt{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font:600 15px/1 ui-monospace,monospace;color:#ffaa44;pointer-events:none;
  }
  /* warning tiles */
  .cell.warn::before{
    content:"";position:absolute;inset:0;border-radius:3px;
    background:repeating-linear-gradient(45deg,rgba(227,0,34,.55) 0 6px,transparent 6px 12px);
    box-shadow:inset 0 0 0 2px rgba(227,0,34,.9);
  }
  .cell.warn.basic::before{opacity:.35;box-shadow:inset 0 0 0 2px rgba(227,0,34,.45)}
  .cell.warn.ready::before{opacity:1}
  .cell.warn-b::before{
    background:repeating-linear-gradient(45deg,rgba(255,138,61,.55) 0 6px,transparent 6px 12px);
    box-shadow:inset 0 0 0 2px rgba(255,138,61,.9);
  }
  .cell .corner{position:absolute;inset:0;pointer-events:none}
  .cell.warn .corner::before,.cell.warn .corner::after{
    content:"";position:absolute;width:12px;height:12px;border:2px solid #fff;border-radius:2px;
  }
  .cell.warn .corner::before{left:3px;top:3px;border-right:0;border-bottom:0}
  .cell.warn .corner::after{right:3px;bottom:3px;border-left:0;border-top:0}
  .cell.warn.basic .corner{display:none}
  .cell .who{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font:700 18px/1 ui-monospace,monospace;
  }
  .cell .who.p{color:#79c0ff;text-shadow:0 0 8px #1f6feb}
  .cell .who.a{color:#ffb3b3}
  .cell .who.b{color:#ffc48a}
  .cell.hit{animation:hitflash .25s linear 2}
  @keyframes hitflash{0%,100%{background:#11161d}50%{background:#5c1218}}

  .bars{display:flex;flex-direction:column;gap:7px;min-height:96px}
  .bar-row{display:flex;flex-direction:column;gap:3px}
  .bar-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
  .bar-lab .val{color:#c9d1d9;font-variant-numeric:tabular-nums}
  .track{position:relative;height:12px;background:#222222;border-radius:2px;overflow:hidden}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;transition:none}
  .fill.recover{background:#4fd658}
  .fill.cast-kd{background:#aaaaaa}
  .fill.cast-fx{background:linear-gradient(90deg,#4fd658,#a5f3b0)}
  .track .ticks{position:absolute;inset:0;pointer-events:none;
    background-image:repeating-linear-gradient(90deg,
      transparent 0, transparent calc(100% / var(--segs) - 1px),
      rgba(0,0,0,.62) calc(100% / var(--segs) - 1px),
      rgba(0,0,0,.62) calc(100% / var(--segs)));}
  .track.flash{animation:barflash .18s linear 3}
  @keyframes barflash{0%,100%{background:#222222}50%{background:#7a1620}}
  .toast{
    font-size:12.5px;padding:5px 10px;border-radius:6px;border:1px solid #63262b;
    background:#2a1116;color:#ff9d9d;animation:toastin .18s ease-out;
  }
  @keyframes toastin{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  .bar-note{font-size:11.5px;color:var(--dim)}

  .log{
    flex:1;min-height:96px;max-height:132px;overflow:auto;
    background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    font:12.5px/1.55 ui-monospace,Consolas,monospace;color:#b7c0ca;
  }
  .log .t{color:#5b6672;margin-right:6px}
  .log .warn{color:#ff9d9d}
  .log .ok{color:#7ee787}
  .log .cast{color:#c9b6ff}
  .log .muted{color:#6b7480}

  .status{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:26px}
  .chip{
    font-size:11.5px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);
    background:#12171e;color:#c9d1d9;display:inline-flex;align-items:center;gap:5px;
  }
  .chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
  .chip.warn i{background:#e30022}
  .chip.cast i{background:#c9b6ff}
  .chip.rec i{background:#4fd658}
  .chip.empty{color:#5b6672;border-style:dashed}

  .ctrl{display:flex;align-items:center;gap:14px;padding:10px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
  button{
    background:#21262d;color:#e6edf3;border:1px solid var(--line);border-radius:6px;
    padding:6px 12px;font:13px/1 inherit;cursor:pointer;
  }
  button:hover{background:#2d333b}
  label.sw{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);cursor:pointer}
  label.sw input{accent-color:#4fd658}
  .mousenote{font-size:12px;color:#ffb3b3}
</style>
</head>
<body>
<header>
  <h1>KD 原样 &nbsp;vs&nbsp; 补好之后</h1>
  <span class="q">验收问题：<b>不动鼠标</b>，你能说出"我下一步会不会挨打"吗？</span>
  <span class="hint">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 方向键 移动 ·
    <kbd>Space</kbd> 按住吟唱（4 tick）· <kbd>R</kbd> 重开
  </span>
</header>

<main>
  <section id="pane-kd">
    <div class="pane-head">
      <h2>KD 原样</h2><span class="tag kd">预警绑鼠标 · 打断静默 · 条永不满</span>
      <span class="tag" id="kd-tick">tick 0</span>
    </div>
    <div class="verdict unknown" id="kd-verdict"><span class="lbl">下一步</span><span id="kd-verdict-txt">—（没有这个 UI）</span></div>
    <div class="board" id="board-kd"></div>
    <div class="mousenote" id="kd-mousenote"></div>
    <div class="bars" id="bars-kd"></div>
    <div class="status" id="status-kd"></div>
    <div class="log" id="log-kd"></div>
  </section>

  <section id="pane-fx">
    <div class="pane-head">
      <h2>补好之后</h2><span class="tag fx">常驻可见 · 打断有反馈 · 连续填充</span>
      <span class="tag" id="fx-tick">tick 0</span>
    </div>
    <div class="verdict" id="fx-verdict"><span class="lbl">下一步</span><span id="fx-verdict-txt">—</span></div>
    <div class="board" id="board-fx"></div>
    <div class="mousenote">&nbsp;</div>
    <div class="bars" id="bars-fx"></div>
    <div class="status" id="status-fx"></div>
    <div class="log" id="log-fx"></div>
  </section>
</main>

<div class="ctrl">
  <button id="btn-reset">重开 (R)</button>
  <label class="sw"><input type="checkbox" id="toggle-warn" checked> 右侧：预警显示（可手动关）</label>
  <span class="hint">在地址后加 <code>?demo=1</code> 可冻结到"定格帧"（不跑时钟，适合截图对照）</span>
  <span class="hint" style="margin-left:auto">
    数字全部来自 <code>readyAt = tick + cost</code> / <code>progress = 1 - (readyAt - tick) / cost</code>，tick = 250ms
  </span>
</div>

<script>
"use strict";

/* ========================= 常量（规格） ========================= */
const TICK_MS = 250;     // 规格：tick = 250ms
const W = 8, H = 8;
const MOVE_COST = 2;     // 玩家移动成本（故意设 2，让"恢复"这件事可见）
const CAST_COST = 4;     // 规格：4 tick 的吟唱
const A_COST    = 2;     // 近战前摇
const B_COST    = 3;     // 远程 AOE：2 tick 预警 + 命中 tick

/* ========================= 两侧状态 ========================= */
function mkSide(seed){
  return {
    tick: 0,
    hp: 6,
    player: { x:1, y:6, readyAt:0 },
    cast: null,            // { startAt, cost, endAt }
    hitFlash: 0,
    deniedAt: -999,
    logs: [],
    enemies: [
      { id:"A", kind:"melee", x:2, y:1, readyAt:0, intent:null, flash:0 },
      { id:"B", kind:"aoe",   x:6, y:1, readyAt:0, intent:null, flash:0 },
    ],
  };
}
let S = { kd: mkSide(), fx: mkSide() };

/* 规格公式 */
const progressOf = (readyAt, tick, cost) => 1 - (readyAt - tick) / cost;

/* ========================= 模拟（两侧逻辑完全相同） ========================= */
function log(side, text, cls){
  side.logs.push({ t: side.tick, text, cls });
  if (side.logs.length > 80) side.logs.shift();
}

function inBoard(x,y){ return x>=0 && y>=0 && x<W && y<H; }
function enemyAt(side,x,y){ return side.enemies.find(e => e.x===x && e.y===y); }
function playerAt(side,x,y){ return side.player.x===x && side.player.y===y; }

function area3x3(cx,cy){
  const out = [];
  for (let y=cy-1; y<=cy+1; y++)
    for (let x=cx-1; x<=cx+1; x++)
      if (inBoard(x,y)) out.push({x,y});
  return out;
}
function stepToward(side, e, p){
  const dx = Math.sign(p.x - e.x), dy = Math.sign(p.y - e.y);
  const order = Math.abs(p.x - e.x) >= Math.abs(p.y - e.y)
    ? [[dx,0],[0,dy]] : [[0,dy],[dx,0]];
  for (const [mx,my] of order){
    if (!mx && !my) continue;
    const nx = e.x+mx, ny = e.y+my;
    if (inBoard(nx,ny) && !playerAt(side, nx, ny) && !enemyAt(side, nx, ny)) { e.x=nx; e.y=ny; return; }
  }
}

function stepSide(side, t){
  side.tick = t;

  /* 1) 结算到点的意图 */
  for (const e of side.enemies){
    if (!e.intent || e.intent.hitAt > t) continue;
    const hit = e.intent.tiles.some(c => c.x===side.player.x && c.y===side.player.y);
    if (e.kind === "melee"){
      if (hit){ side.hp--; side.hitFlash = 2; log(side, `A 命中了你  -1 HP`, "warn"); }
      else log(side, `A 打空了（你闪开了）`, "muted");
    } else {
      if (hit){ side.hp--; side.hitFlash = 2; log(side, `B 的 AOE 命中了你  -1 HP`, "warn"); }
      else log(side, `B 的 AOE 落空（你出去了）`, "ok");
    }
    e.intent = null;
    e.readyAt = t + 1;
  }

  /* 2) 到点的敌人宣示意图 */
  for (const e of side.enemies){
    if (e.intent || e.readyAt > t) continue;
    if (e.kind === "melee"){
      const adj = Math.max(Math.abs(e.x-side.player.x), Math.abs(e.y-side.player.y)) <= 1;
      if (adj){
        e.intent = { tiles:[{x:side.player.x, y:side.player.y}], hitAt: t + A_COST, cost: A_COST };
        log(side, `A 举起武器 → ${A_COST} tick 后命中`, "muted");
      } else {
        stepToward(side, e, side.player);
        e.readyAt = t + A_COST;
      }
    } else {
      e.intent = { tiles: area3x3(side.player.x, side.player.y), hitAt: t + B_COST, cost: B_COST };
      log(side, `B 开始咏唱（3×3 范围，${B_COST} tick）`, "cast");
    }
  }

  /* 3) 吟唱推进 */
  if (side.cast){
    const p = t - side.cast.startAt;
    if (p >= side.cast.cost){ finishCast(side); }
  }

  if (side.hp <= 0){ side.hp = 6; side.player.x = 1; side.player.y = 6; side.cast = null;
    for (const e of side.enemies){ e.intent=null; e.readyAt = t+2; e.x = e.kind==="melee"?2:6; e.y=1; }
    log(side, `—— HP 归零，重开 ——`, "muted"); }
}

function finishCast(side){
  side.cast = null;
  log(side, `吟唱完成：冲击波`, "ok");
  for (const e of side.enemies){ if (e.intent){ e.intent = null; e.readyAt = side.tick + 1; e.flash = 2; } }
}

/* 打断：两侧行为相同，反馈不同 */
function interruptCast(side, why){
  if (!side.cast) return;
  const elapsed = side.tick - side.cast.startAt;
  side.cast = null;
  const now = performance.now();
  side.ghost = { until: now + 900, elapsed, cost: CAST_COST };        /* 右侧：残影条闪红 */
  side.toast = { until: now + 1300,
                 text: why === "move" ? "吟唱被打断 —— 移动取消了它" : "吟唱被打断 —— 你松手了" };
  /* 左侧：只有日志里多一行，界面上什么都不留（这就是"静默"） */
  log(side, why === "move" ? `吟唱被打断（移动）` : `吟唱被打断（松手）`, "cast");
}

/* ========================= 输入（两侧共享） ========================= */
let spaceHeld = false;

/* 被拒绝的操作：左侧静默（这就是"按了没反应"），右侧给明确原因 */
function deny(side, text){
  side.deniedAt = performance.now();
  side.toast = { until: performance.now() + 900, text };
}

function move(side, dx, dy){
  if (side.cast) interruptCast(side, "move");
  if (side.tick < side.player.readyAt){
    deny(side, `恢复中 · 还需 ${side.player.readyAt - side.tick} tick`);
    return;
  }
  const nx = side.player.x + dx, ny = side.player.y + dy;
  if (!inBoard(nx,ny)) return;
  if (enemyAt(side,nx,ny)) return;
  side.player.x = nx; side.player.y = ny;
  side.player.readyAt = side.tick + MOVE_COST;
}

document.addEventListener("keydown", (ev) => {
  const k = ev.key;
  const map = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
                w:[0,-1], s:[0,1], a:[-1,0], d:[1,0], W:[0,-1], S:[0,1], A:[-1,0], D:[1,0] };
  if (map[k]){ ev.preventDefault(); move(S.kd, ...map[k]); move(S.fx, ...map[k]); return; }
  if (k === " "){
    ev.preventDefault();
    if (!spaceHeld){
      spaceHeld = true;
      for (const side of [S.kd, S.fx]){
        if (!side.cast && side.tick >= side.player.readyAt){
          side.cast = { startAt: side.tick, cost: CAST_COST };
          log(side, `开始吟唱（${CAST_COST} tick）`, "cast");
        } else if (!side.cast){
          deny(side, `恢复中 · 还需 ${side.player.readyAt - side.tick} tick`);
        }
      }
    }
    return;
  }
  if (k === "r" || k === "R"){ resetAll(); }
});
document.addEventListener("keyup", (ev) => {
  if (ev.key === " "){
    spaceHeld = false;
    for (const side of [S.kd, S.fx]) if (side.cast && side.tick - side.cast.startAt < side.cast.cost) interruptCast(side, "release");
  }
});

function resetAll(){
  S = { kd: mkSide(), fx: mkSide() };
  S_kdRef = S.kd;
  for (const id of ["kd","fx"]){ buildBoard(id); }
}

/* ========================= 棋盘 ========================= */
const boards = {};
function buildBoard(id){
  const el = document.getElementById("board-"+id);
  el.innerHTML = "";
  const cells = [];
  for (let y=0; y<H; y++){
    for (let x=0; x<W; x++){
      const c = document.createElement("div");
      c.className = "cell" + (((x+y)%2)? " dark":"");
      c.innerHTML = '<div class="corner"></div><div class="who"></div><div class="tagtxt"></div>';
      c.dataset.x = x; c.dataset.y = y;
      el.appendChild(c);
      cells.push(c);
    }
  }
  boards[id] = cells;
}

/* 鼠标进入左侧棋盘 → KD 才画预警（这就是它的真实行为） */
let mouseInLeft  = false;
let mouseInRight = false;
let hoverCell = null;

function bindMouse(id, isLeft){
  const el = document.getElementById("board-"+id);
  el.addEventListener("mouseenter", () => { if (isLeft) mouseInLeft = true; else mouseInRight = true; });
  el.addEventListener("mouseleave", () => { if (isLeft) mouseInLeft = false; else mouseInRight = false; hoverCell = null; });
  el.addEventListener("mousemove", (ev) => {
    const t = ev.target.closest(".cell");
    hoverCell = t ? { x:+t.dataset.x, y:+t.dataset.y } : null;
  });
}

/* ========================= 渲染 ========================= */
function renderSide(id, side, opts){
  const cells = boards[id];
  const t = side.tick;

  /* 每个格子的状态类 */
  for (const c of cells){
    const x = +c.dataset.x, y = +c.dataset.y;
    c.className = "cell" + (((x+y)%2)? " dark":"");
    c.querySelector(".who").textContent = "";
    c.querySelector(".who").className = "who";
    c.querySelector(".tagtxt").textContent = "";
  }

  const showWarn = opts.showWarn;
  if (showWarn){
    for (const e of side.enemies){
      if (!e.intent) continue;
      const ratio = progressOf(e.intent.hitAt, t, e.intent.cost);   // 规格公式
      const ready = ratio >= 1 - 1e-6;
      for (const tile of e.intent.tiles){
        const c = cells[tile.y*W + tile.x];
        if (!c) continue;
        const cls = " warn" + (e.kind==="aoe" ? " warn-b" : "") + (ready? " ready":" basic") + (e.intent.tiles.length===1? "": "");
        c.className += cls;
      }
    }
  }

  /* 实体 */
  const p = cells[side.player.y*W + side.player.x];
  if (p){ p.querySelector(".who").textContent = "@"; p.querySelector(".who").className = "who p"; }
  for (const e of side.enemies){
    const c = cells[e.y*W + e.x];
    if (!c) continue;
    c.querySelector(".who").textContent = e.id;
    c.querySelector(".who").className = "who " + e.id.toLowerCase();
  }

  /* 左侧：只有鼠标在棋盘上时才画 xN（KD 的真实行为） */
  if (id === "kd" && hoverCell && t < side.player.readyAt){
    const c = cells[hoverCell.y*W + hoverCell.x];
    if (c) c.querySelector(".tagtxt").textContent = "x" + (side.player.readyAt - t + 1);
  }
  if (id === "fx"){
    /* 右侧：目标格永远显示"还需几 tick" */
    if (t < side.player.readyAt && side.player){ /* 棋盘外由恢复条表达 */ }
  }

  /* 命中闪 */
  if (side.hitFlash > 0){
    const pp = cells[side.player.y*W + side.player.x];
    if (pp) pp.classList.add("hit");
    side.hitFlash--;
  }

  document.getElementById(id+"-tick").textContent = "tick " + t + " · HP " + side.hp;

  /* ---------- 进度条 ---------- */
  const bars = document.getElementById("bars-"+id);
  const nowMs = performance.now();
  let html = "";

  if (id === "fx"){
    /* 打断 toast（只有右侧有） */
    if (side.toast && nowMs < side.toast.until){
      html += `<div class="toast">${side.toast.text}</div>`;
    }
    /* 恢复条：连续填充 */
    const rec = t < side.player.readyAt ? progressOf(side.player.readyAt, t, MOVE_COST) : 1;
    html += barRow("恢复", t < side.player.readyAt
        ? ("剩余 " + (side.player.readyAt - t) + " tick")
        : "就绪",
      `<div class="fill recover" style="width:${(rec*100).toFixed(1)}%"></div>`, MOVE_COST, false);
  }

  /* 蓄力条：两侧形态不同 */
  if (side.cast){
    const elapsed = t - side.cast.startAt;
    if (id === "kd"){
      /* KD：用 elapsed 当 tick，阶梯跳，且永远差一格 */
      const stepped = (Math.floor(elapsed) / side.cast.cost) * 100;
      html += barRow("Struggling...", "",
        `<div class="fill cast-kd" style="width:${stepped.toFixed(1)}%"></div>`, side.cast.cost, false);
    } else {
      const ratio = progressOf(side.cast.startAt + side.cast.cost, t, side.cast.cost);  /* 规格公式 */
      html += barRow("吟唱中", "剩余 " + Math.max(0, side.cast.cost - elapsed) + " tick",
        `<div class="fill cast-fx" style="width:${(ratio*100).toFixed(1)}%"></div>`, side.cast.cost, false);
    }
  } else if (id === "fx" && side.ghost && nowMs < side.ghost.until){
    /* 右侧：打断残影，闪红 */
    const pct = Math.min(100, (side.ghost.elapsed / side.ghost.cost) * 100);
    html += barRow("吟唱 · 已打断", "取消",
      `<div class="fill" style="width:${pct.toFixed(1)}%;background:#e30022"></div>`, side.ghost.cost, true);
  } else if (id === "kd"){
    html += `<div class="bar-row"><div class="bar-note">（无蓄力 / 被打断后，这里直接空掉，没有任何提示）</div></div>`;
  }

  bars.innerHTML = html;

  /* ---------- 状态图标 ---------- */
  const st = document.getElementById("status-"+id);
  const chips = [];
  if (side.cast) chips.push(`<span class="chip cast"><i></i>吟唱 ${Math.min(t-side.cast.startAt, side.cast.cost)}/${side.cast.cost}</span>`);
  if (t < side.player.readyAt){
    if (id === "kd"){
      /* KD 的真实文案：被减速也告诉你"你被眩晕了"，且和真 stun 共用同一个图标 */
      chips.push(`<span class="chip warn"><i></i>Stunned! You can't move!</span>`);
    } else {
      chips.push(`<span class="chip rec"><i></i>恢复中 · 还需 ${side.player.readyAt - t} tick</span>`);
    }
  }
  if (id === "fx"){
    for (const e of side.enemies){
      if (!e.intent) continue;
      const ratio = progressOf(e.intent.hitAt, t, e.intent.cost);
      chips.push(`<span class="chip warn"><i></i>${e.id} ${(ratio*100).toFixed(0)}%${ratio>=1-1e-6?" 即将命中":""}</span>`);
    }
  }
  if (id === "kd"){
    /* KD：状态图标互斥，只显示优先级最高的一个 */
    st.innerHTML = chips.length ? chips[0] : `<span class="chip empty">无状态</span>`;
  } else {
    st.innerHTML = chips.length ? chips.join("") : `<span class="chip empty">无状态</span>`;
  }

  /* ---------- 判定：下一步会不会挨打 ---------- */
  if (id === "fx"){
    const v = document.getElementById("fx-verdict");
    const vt = document.getElementById("fx-verdict-txt");
    const threats = side.enemies.filter(e => e.intent).map(e => ({
      id: e.id, hitAt: e.intent.hitAt,
      hits: e.intent.tiles.some(c => c.x===side.player.x && c.y===side.player.y),
    })).sort((a,b)=>a.hitAt-b.hitAt);
    const soon = threats.find(x => x.hits);
    v.className = "verdict";
    if (!threats.length){ v.classList.add("safe"); vt.textContent = "安全（没有敌人正在出手）"; }
    else if (soon && soon.hitAt === t + 1){ v.classList.add("now"); vt.textContent = `⚠ 下一 tick 会被 ${soon.id} 命中（-1 HP）→ 现在就走`; }
    else if (soon){ v.classList.add("soon"); vt.textContent = `${soon.hitAt - t} tick 后 ${soon.id} 会命中你（可躲）`; }
    else { v.classList.add("safe"); vt.textContent = `安全（${threats[0].id} 会打空）`; }
  }

  /* ---------- 日志 ---------- */
  const lg = document.getElementById("log-"+id);
  lg.innerHTML = side.logs.slice(-40).map(l =>
    `<div><span class="t">t${l.t}</span><span class="${l.cls||""}">${l.text}</span></div>`).join("");
  lg.scrollTop = lg.scrollHeight;

  /* ---------- 左侧鼠标提示 ---------- */
  if (id === "kd"){
    document.getElementById("kd-mousenote").textContent = showWarn
      ? "" : "⚠ 鼠标不在棋盘上 → KD 不画任何预警（但敌人照常结算）";
  }
}

function barRow(label, val, fillHtml, segCount, flashing){
  return `<div class="bar-row">
    <div class="bar-lab"><span>${label}</span><span class="val">${val}</span></div>
    <div class="track${flashing?" flash":""}">${fillHtml}<div class="ticks" style="--segs:${segCount}"></div></div>
  </div>`;
}

/* ========================= 主循环 ========================= */
const toggleWarn = document.getElementById("toggle-warn");

function frame(){
  renderSide("kd", S.kd, { showWarn: mouseInLeft });
  renderSide("fx", S.fx, { showWarn: toggleWarn.checked });
  requestAnimationFrame(frame);
}

setInterval(() => {
  if (DEMO) return;
  const t = S.kd.tick + 1;
  stepSide(S.kd, t);
  stepSide(S.fx, t);
}, TICK_MS);

document.getElementById("btn-reset").addEventListener("click", resetAll);

/* 初始化 */
buildBoard("kd"); buildBoard("fx");
bindMouse("kd", true); bindMouse("fx", false);
log(S.kd, `敌人 A：近战，前摇 ${A_COST} tick`, "muted");
log(S.kd, `敌人 B：远程 AOE，预警 ${B_COST-1} tick`, "muted");
log(S.fx, `敌人 A：近战，前摇 ${A_COST} tick`, "muted");
log(S.fx, `敌人 B：远程 AOE，预警 ${B_COST-1} tick`, "muted");

/* 静态预览：?demo=1 → 冻结时钟，摆出一个"两侧都有蓄力 + 一侧有预警"的定格 */
let DEMO = false;
if (location.search.includes("demo")){
  DEMO = true;
  for (let i=1; i<=3; i++){ stepSide(S.kd, i); stepSide(S.fx, i); }   // B 在 t1 开始咏唱，t4 才命中
  for (const side of [S.kd, S.fx]){
    side.cast = { startAt: side.tick - 2, cost: CAST_COST };          // 吟唱 2/4
    side.player.readyAt = side.tick + 1;                              // 恢复中（剩 1 tick）
    const a = side.enemies[0];
    a.x = side.player.x + 1; a.y = side.player.y - 1;
    a.intent = { tiles:[{x:side.player.x, y:side.player.y}], hitAt: side.tick + 1, cost: A_COST }; // 下一 tick 命中
    log(side, `A 举起武器 → 1 tick 后命中`, "muted");
  }
  mouseInLeft = false;   // 定格里故意让鼠标"不在棋盘上"→ 左边什么都不画
}

frame();
</script>
</body>
