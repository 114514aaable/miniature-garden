name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  packs:
    name: 校验世界包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python tools/validate/validate.py worlds/official examples/minimal-world

  licenses:
    name: 许可合规
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reuse
      # 许可全文尚未入库时在 CI 里补齐；稳定后应改为提交进仓库。
      - run: reuse download AGPL-3.0-or-later CC-BY-4.0 CC-BY-SA-4.0 CC0-1.0 || true
      - run: reuse lint
